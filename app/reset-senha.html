<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --surface: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.10);
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --accent2: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top left, var(--bg-2), var(--bg-1) 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  h1 { font-size: 1.6rem; margin: 0 0 12px; font-weight: 600; letter-spacing: -0.02em; }
  p { color: var(--text-dim); font-size: 0.92rem; line-height: 1.5; margin: 0 0 22px; }
  a {
    display: inline-block;
    color: #0f172a;
    text-decoration: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Senha desativada no portfolio</h1>
    <p>Esta versao e estatica, sem login, sem e-mail e sem banco de dados. Todas as areas administrativas estao liberadas para demonstracao.</p>
    <a href="admin.html">Abrir administracao</a>
  </div>
</body>
</html>
